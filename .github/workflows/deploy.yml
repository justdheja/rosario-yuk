name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  # Lets you run the deploy by hand from the Actions tab.
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only, which is why the gh-pages push was
# denied. Granting contents:write lets the action push the published site.
permissions:
  contents: write

# Only one deploy at a time; never cancel one midway through a push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm ci installs exactly what package-lock.json pins, so the build
        # matches what you tested locally and fails loudly on a bad lockfile.
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
